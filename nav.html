<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navigation Bar</title>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Libre+Caslon+Condensed:ital,wght@0,400..700;1,400..700&display=swap');
    *{
      padding: 0;
      margin: 0;
    }
    body{
      font-family: 'Libre Caslon Condensed', serif;
    }
    nav{
      display: flex;
      justify-content: center;
      border-bottom: #000 1px solid;
      /* background: #000; */
    }
    .nav-items{
      width: 80%;
      /* background: #6e6969; */
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .nav-items ul{
      display: flex;
      list-style-type: none;
    }
    .nav-items li{
      margin-right: 15px;
      margin-left: 15px;

    }
    .nav-items a{
      text-decoration: none;
      color: #000;
      text-transform: uppercase;
    }
    .nav-items a:hover{
      color: #bfb6b0;
      text-decoration: underline;
      cursor: pointer;
    }
    .nav-items img{
      width: 48px;
      height: 48px;
    }
    /* git add . */
    /* git commit -m "Built the nav bar"*/
    /* git push */

  </style>
</head>
<body>
  <!-- semantic tags- give some meaning to the elements created...they are just divs -->
   <nav>
    <div class="nav-items">
      <img src="images/ux.png" alt="Company Logo" width="100px" height="100px">
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About Us</a></li>
        <li><a href="#">Team</a></li>
        <li><a href="#">Pricing</a></li>
        <li><a href="#">Contact Us</a></li>
      </ul>
    </div>
   </nav>

   <footer>

   </footer>
</body>
</html>
