<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tables</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    table {
      width: 65%;
      border: 1px solid #0f0e0e;
      margin: auto;
      border-collapse: collapse;
    }
    th {
      color: #9c2327;
      border: 1px solid #0f0e0e;
      padding: 12px, 6px;
      text-align: left;
      background-color: #ffe4c4;
    }
    td {
      color: #4717a5;
      border: 1px solid #0f0e0e;
      padding: 12px, 6px;
      text-align: left;
    }

    .salary {
      color: #008000;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <table>
    <thead>
      <tr>
        <th>First Name</th>
        <th>Last Name</th>
        <th>City</th>
        <th>Age</th>
        <th>Salary</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>John</td>
        <td>Doe</td>
        <td>New York</td>
        <td>30</td>
        <td class="salary">$5000</td>
      </tr>
      <tr>
        <td>Jane</td>
        <td>Smith</td>
        <td>Los Angeles</td>
        <td>25</td>
        <td class="salary">$6000</td>
      </tr>
      <tr>
        <td>Mike</td>
        <td>Johnson</td>
        <td>Chicago</td>
        <td>35</td>
        <td class="salary">$7000</td>
      </tr>
      <tr>
        <td>Emily</td>
        <td>Davis</td>
        <td>Houston</td>
        <td>28</td>
        <td class="salary">$5500</td>
      </tr>
      <tr>
        <td>David</td>
        <td>Wilson</td>
        <td>Phoenix</td>
        <td>32</td>
        <td class="salary">$6500</td>
      </tr>


    </tbody>
  </table>

  <!-- list...unodered, ordered -->
   <ul>
    <li>Nairobi</li>
    <li>Mombasa</li>
    <li>Nyeri</li>
    <li>Kisumu</li>
    <li>Eldoret</li>
   </ul>




</body>
</html>
